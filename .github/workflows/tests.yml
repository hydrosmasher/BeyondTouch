name: Numerical checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python Scripts/run_example_suite.py --output outputs/examples --workers 2
      - run: python Scripts/verify_example_suite.py --results outputs/examples
