name: Import credited Last Row educational data
on:
  push:
    paths: ['.github/workflows/import-lastrow.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and split the source into small reproducible files
        shell: python
        run: |
          import urllib.request,hashlib,csv,io,gzip,base64,json,pathlib
          url='https://raw.githubusercontent.com/Friends-of-Tracking-Data-FoTD/Last-Row/master/datasets/positional_data/liverpool_2019.csv'
          raw=urllib.request.urlopen(url,timeout=60).read()
          expected='77e053fba2f9569a60cd41d87a817bee0028c2c2'
          actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert actual==expected,(actual,expected)
          reader=csv.DictReader(io.StringIO(raw.decode()));fields=reader.fieldnames;groups={}
          for row in reader:groups.setdefault(row['play'],[]).append(row)
          root=pathlib.Path('src/real_data/lastrow-import');root.mkdir(parents=True,exist_ok=True)
          entries=[]
          for n,(play,rows) in enumerate(sorted(groups.items()),1):
              text=io.StringIO(newline='');w=csv.DictWriter(text,fieldnames=fields);w.writeheader();w.writerows(rows)
              name=f'case-{n:02d}.csv.gz.b64';blob=gzip.compress(text.getvalue().encode(),mtime=0)
              (root/name).write_text(base64.b64encode(blob).decode())
              entries.append(dict(play=play,file=name,rows=len(rows),players=sorted({r['player'] for r in rows}),frame_min=min(int(r['frame']) for r in rows),frame_max=max(int(r['frame']) for r in rows)))
          readme=urllib.request.urlopen('https://raw.githubusercontent.com/Friends-of-Tracking-Data-FoTD/Last-Row/master/README.md').read()
          (root/'SOURCE_README.md').write_bytes(readme)
          (root/'index.json').write_text(json.dumps(dict(source_url=url,git_blob_sha=actual,sha256=hashlib.sha256(raw).hexdigest(),native_hz=20,author='Ricardo Tavares / Last Row / Friends of Tracking',warning='Educational hand-collected trajectories; incomplete player coverage; source says not research accuracy.',cases=entries),indent=2))
          print(json.dumps(entries,indent=2))
      - name: Commit only the imported educational data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/real_data/lastrow-import
          git diff --cached --quiet || git commit -m "Import verified Last Row Liverpool sequences with source attribution"
          git push
