name: Build annotated real-case stories
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-story-media
  cancel-in-progress: false
jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt imageio-ffmpeg==0.6.0
      - run: python src/refresh_stories.py
      - run: python src/verify_package.py
      - name: Publish the annotated real-case media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/pl-*
          git diff --cached --quiet || git commit -m "Render observed defender paths, direction arrows and tactical story videos"
          git push
