name: Build Liverpool submission at 50 fps
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: submission-50fps
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt imageio-ffmpeg==0.6.0
      - run: python src/build_submission_50fps.py
      - name: Publish the submission pair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/BeyondTouch-Liverpool-50fps.mp4 uploads/BeyondTouch-Liverpool.png uploads/Liverpool-50fps-metadata.json
          git diff --cached --quiet || git commit -m "Publish real Liverpool submission video at 50 fps and matching picture"
          git push
