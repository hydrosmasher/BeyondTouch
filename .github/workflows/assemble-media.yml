name: Preserve supplied media and rebuild submission video
on:
  push:
    paths: ['.media-build/manifest.json', '.github/workflows/assemble-media.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and assemble the original supplied files
        shell: python
        run: |
          import json,pathlib,hashlib,shutil
          root=pathlib.Path('.media-build')
          for entry in json.loads((root/'manifest.json').read_text()):
              raw=b''.join((root/p).read_bytes() for p in entry['parts'])
              assert hashlib.sha256(raw).hexdigest()==entry['sha256']
              target=pathlib.Path(entry['target']);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
          shutil.rmtree(root)
      - run: python -m pip install Pillow==12.3.0 imageio-ffmpeg==0.6.0
      - run: python src/build_upload_video.py
      - name: Save original media and submission outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .media-build examples/di-maria-final/sources examples/supplied-context uploads
          git diff --cached --quiet || git commit -m "Preserve full supplied media and build the real-event submission video"
          git pull --rebase
          git push
