name: Download current submission media
on:
  push:
    paths: ['.github/workflows/transfer-primary.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import pathlib,base64,json,hashlib
          p=pathlib.Path('uploads/BeyondTouch-Liverpool-50fps.mp4')
          meta=json.loads(pathlib.Path('uploads/Liverpool-50fps-metadata.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==meta['mp4_sha256']
          b=base64.b64encode(p.read_bytes()).decode()
          d=pathlib.Path('.transfer-primary');d.mkdir()
          for i,k in enumerate(range(0,len(b),450000)):(d/f'part-{i:02d}.txt').write_text(b[k:k+450000])
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .transfer-primary
          git commit -m "Prepare verified current media download"
          git push
