name: Build submission MP4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0 imageio-ffmpeg==0.6.0
      - run: python src/build_upload_video.py
      - name: Save verified upload video
        run: |
          cat uploads/video-metadata.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/BeyondTouch-DiMaria.mp4 uploads/video-metadata.json
          git diff --cached --quiet || git commit -m "Build Di Maria full-animation evidence explainer MP4"
          git pull --rebase
          git push
